name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests and coverage
        run: pytest --cov=aurelia_sme_sales --cov-report=term-missing --cov-branch
      - name: Verify committed deliverables and manifest
        run: python scripts/verify_artifacts.py

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Keep a copy of the committed results
        run: |
          mkdir -p "$RUNNER_TEMP/committed/artifacts"
          cp -r data "$RUNNER_TEMP/committed/data"
          cp -r artifacts/results "$RUNNER_TEMP/committed/artifacts/results"
          cp artifacts/aurelia_sme_sales_demo.sqlite "$RUNNER_TEMP/committed/artifacts/"
      - name: Regenerate governed demo
        run: python scripts/run_demo.py
      # MANIFEST.sha256 only proves the committed files are intact. This step proves the
      # current code still produces them (CSV/JSON values within rel 1e-9, SQLite rows).
      - name: Compare regenerated results with the committed results
        run: python scripts/compare_outputs.py "$RUNNER_TEMP/committed"
