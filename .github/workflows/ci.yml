name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests and coverage
        run: pytest --cov=aurelia_sme_sales --cov-report=term-missing --cov-branch

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Regenerate governed demo
        run: python scripts/run_demo.py
      - name: Verify deterministic digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/results/executive_summary.json").read_text())
          assert len(payload["canonical_result_sha256"]) == 64
          assert payload["data_quality_passed"] == payload["data_quality_total"]
          assert payload["prioritised_conversations"] > 0
          print(payload["canonical_result_sha256"])
          PY
